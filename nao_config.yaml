project_name: administration-plus

# Identifiants via l'environnement de l'app Scalingo (NAO_DB_URL, décomposée par bin/web.sh).
databases:
  - name: aplus-postgres
    type: postgres
    host: "{{ env('NAO_DB_HOST') }}"
    port: "{{ env('NAO_DB_PORT') }}"
    database: "{{ env('NAO_DB_NAME') }}"
    user: "{{ env('NAO_DB_USER') }}"
    password: "{{ env('NAO_DB_PASSWORD') }}"
    schema_name: public

    # Bloque tout SQL sur une table absente de databases/. Nouvelle table = resync.
    allow_listed_only: true

    # Dépôt public : structure seule. preview et profiling publieraient des données réelles.
    templates:
      - columns

    # Jointures Prisma : seules celles du GRANT restent visibles.
    exclude:
      - "public._prisma_migrations"
      - "public._AnswerToFile"
      - "public._AreaToPendingSupervisor"
      - "public._AreaToSupervisor"
      - "public._DeactivatedUserManagedTeams"
      - "public._DeactivatedUserTeams"
      - "public._OrganizationToPendingSupervisor"
      - "public._OrganizationToSupervisor"
      - "public._OrganizationToTeamSpecificField"
      - "public._PendingManagersTeams"
      - "public._PendingUsersTeams"
      - "public.Account"
      - "public.Session"
      - "public.Verification"
      - "public.TwoFactor"
      - "public.MaintenanceMode"
      - "public.SiteBanner"
      - "public.NotificationView"
      - "public.pg_stat_statements*"

    # Miroir des colonnes révoquées en base : nao les documenterait sinon.
    exclude_columns:
      - "public.Report.subject"
      - "public.Report.description"
      - "public.Report.nir"
      - "public.Report.nif"
      - "public.Report.caf"
      - "public.Report.firstName"
      - "public.Report.lastName"
      - "public.Report.maritalName"
      - "public.Report.birthDate"
      - "public.Report.phone"
      - "public.Answer.content"
      - "public.User.phone"
      - "public.User.internalSupportComment"
      - "public.User.banReason"
      - "public.PendingUser.verificationToken"
      - "public.AnalyticsEvent.ipAddress"

repos:
  - name: aplus-product
    url: https://gitlab.com/incubateur-territoires/startups/administration-plus/administration-plus
    branch: main
    include:
      - "README.md"
      - "CLAUDE.md"
      - "package.json"
      - "cron.json"
      - "prisma/**"
      - "docs/**"
      - "specs/**"
      - "src/**"
    exclude:
      - "src/generated/**"
      - "src/dsfr-bootstrap/**"
      - "src/**/*.json"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.woff*"

# Notion passe par le MCP (agent/mcps/mcp.json), pas par nao sync.
# LLM configuré dans l'interface nao.
llm: null
